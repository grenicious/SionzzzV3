<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SION V2 — Control Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   ROOT & RESET
═══════════════════════════════════════════ */
:root {
  --purple:      #9b30ff;
  --purple-dim:  #6b1fd4;
  --purple-glow: rgba(155,48,255,0.45);
  --purple-soft: rgba(155,48,255,0.12);
  --orange:      #ff6b1a;
  --orange-glow: rgba(255,107,26,0.5);
  --orange-soft: rgba(255,107,26,0.12);
  --black:       #060608;
  --glass:       rgba(18,8,35,0.72);
  --glass2:      rgba(30,10,55,0.6);
  --border:      rgba(155,48,255,0.25);
  --text:        rgba(255,255,255,0.9);
  --text-dim:    rgba(255,255,255,0.4);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height: 100vh;
  background: var(--black);
  font-family: 'Rajdhani', sans-serif;
  color: var(--text);
  overflow: hidden;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ═══════════════════════════════════════════
   BACKGROUND — animated mesh + particles
═══════════════════════════════════════════ */
.bg-layer {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
}

/* radial mesh */
.bg-mesh {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 70% 60% at 15% 40%, rgba(100,20,200,0.22) 0%, transparent 65%),
    radial-gradient(ellipse 55% 50% at 85% 65%, rgba(155,48,255,0.14) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 50% 10%,  rgba(80,0,160,0.18) 0%, transparent 55%),
    #060608;
}

/* animated orbs */
.orb {
  position: fixed; border-radius: 50%; filter: blur(80px);
  pointer-events: none; z-index: 0; opacity: 0.35;
  animation: orbFloat 12s ease-in-out infinite alternate;
}
.orb1 { width:340px; height:340px; background:#7000cc; top:-80px; left:-80px; animation-delay:0s; }
.orb2 { width:260px; height:260px; background:#4b00a8; bottom:-60px; right:-60px; animation-delay:-4s; }
.orb3 { width:180px; height:180px; background:#9b30ff; top:40%; left:60%; animation-delay:-8s; }
@keyframes orbFloat {
  0%   { transform: translate(0,0) scale(1); }
  100% { transform: translate(30px,20px) scale(1.08); }
}

/* grid */
.bg-grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(155,48,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(155,48,255,0.05) 1px, transparent 1px);
  background-size: 44px 44px;
  animation: gridScroll 25s linear infinite;
}
@keyframes gridScroll {
  0%   { background-position: 0 0; }
  100% { background-position: 44px 44px; }
}

/* canvas stars */
canvas#stars {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
}

/* scan line */
.scanline {
  position: fixed; inset: 0; z-index: 99; pointer-events: none;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px
  );
}

/* ═══════════════════════════════════════════
   PAGE WRAPPER
═══════════════════════════════════════════ */
.page {
  position: fixed; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.22,1,0.36,1);
  transform: translateY(24px) scale(0.98);
}
.page.active {
  opacity: 1; pointer-events: all;
  transform: translateY(0) scale(1);
}
.page.exit {
  opacity: 0;
  transform: translateY(-28px) scale(0.97);
}

/* ═══════════════════════════════════════════
   GLASS CARD
═══════════════════════════════════════════ */
.glass-card {
  width: 100%; max-width: 420px;
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 44px 28px 36px;
  backdrop-filter: blur(28px) saturate(160%);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  box-shadow:
    0 8px 60px rgba(0,0,0,0.7),
    0 0 0 1px rgba(155,48,255,0.1),
    inset 0 1px 0 rgba(255,255,255,0.07);
  position: relative;
  overflow: hidden;
}
.glass-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--purple), transparent);
  opacity: 0.7;
}

/* corner brackets */
.glass-card::after {
  content: '';
  position: absolute;
  inset: 10px;
  border-radius: 18px;
  pointer-events: none;
  background:
    linear-gradient(white, white) top left / 16px 2px no-repeat,
    linear-gradient(white, white) top left / 2px 16px no-repeat,
    linear-gradient(white, white) top right / 16px 2px no-repeat,
    linear-gradient(white, white) top right / 2px 16px no-repeat,
    linear-gradient(white, white) bottom left / 16px 2px no-repeat,
    linear-gradient(white, white) bottom left / 2px 16px no-repeat,
    linear-gradient(white, white) bottom right / 16px 2px no-repeat,
    linear-gradient(white, white) bottom right / 2px 16px no-repeat;
  opacity: 0.06;
}

/* ═══════════════════════════════════════════
   HOME PAGE
═══════════════════════════════════════════ */
#home {
  flex-direction: column;
  text-align: center;
}

.home-logo {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: clamp(2.4rem, 8vw, 3.2rem);
  letter-spacing: 0.18em;
  color: #fff;
  text-shadow: 0 0 30px var(--purple-glow), 0 0 80px rgba(155,48,255,0.25);
  margin-bottom: 4px;
  animation: logoPulse 3s ease-in-out infinite;
}
.home-logo span { color: var(--purple); }

@keyframes logoPulse {
  0%,100% { text-shadow: 0 0 30px var(--purple-glow), 0 0 80px rgba(155,48,255,0.2); }
  50%      { text-shadow: 0 0 50px var(--purple-glow), 0 0 120px rgba(155,48,255,0.35); }
}

.home-tag {
  font-size: 0.7rem;
  letter-spacing: 0.35em;
  color: rgba(155,48,255,0.6);
  text-transform: uppercase;
  margin-bottom: 36px;
}

.home-divider {
  width: 60%; height: 1px; margin: 0 auto 32px;
  background: linear-gradient(90deg, transparent, var(--purple), transparent);
  opacity: 0.4;
}

.home-desc {
  font-size: 0.88rem;
  color: var(--text-dim);
  line-height: 1.65;
  letter-spacing: 0.04em;
  margin-bottom: 40px;
  max-width: 280px;
  margin-left: auto; margin-right: auto;
}

/* ENTER BUTTON */
.btn-enter {
  position: relative;
  padding: 16px 56px;
  background: transparent;
  border: 1.5px solid var(--purple);
  border-radius: 50px;
  color: #fff;
  font-family: 'Orbitron', monospace;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.28em;
  cursor: pointer;
  overflow: hidden;
  transition: all 0.35s ease;
  box-shadow: 0 0 20px rgba(155,48,255,0.3), inset 0 0 20px rgba(155,48,255,0.05);
}
.btn-enter::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--purple-dim), var(--purple));
  opacity: 0;
  transition: opacity 0.35s;
  border-radius: inherit;
}
.btn-enter:hover {
  box-shadow: 0 0 40px rgba(155,48,255,0.6), 0 0 80px rgba(155,48,255,0.2), inset 0 0 30px rgba(155,48,255,0.1);
  transform: translateY(-2px);
}
.btn-enter:hover::before { opacity: 1; }
.btn-enter:active { transform: scale(0.96) translateY(0); }
.btn-enter span { position: relative; z-index: 1; }

/* ripple */
.btn-enter .ripple {
  position: absolute; border-radius: 50%;
  background: rgba(255,255,255,0.25);
  transform: scale(0); animation: rippleAnim 0.55s ease-out forwards;
  pointer-events: none;
}
@keyframes rippleAnim {
  to { transform: scale(4); opacity: 0; }
}

/* status bar */
.status-row {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; margin-top: 28px;
  font-size: 0.68rem; letter-spacing: 0.18em;
  color: rgba(155,48,255,0.45); text-transform: uppercase;
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--purple);
  box-shadow: 0 0 8px var(--purple);
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink {
  0%,100% { opacity: 1; } 50% { opacity: 0.3; }
}

/* ═══════════════════════════════════════════
   PAGE 1 — FUNCTIONS
═══════════════════════════════════════════ */
#panel {
  flex-direction: column;
}

.panel-header {
  text-align: center;
  margin-bottom: 28px;
}
.panel-title {
  font-family: 'Orbitron', monospace;
  font-size: clamp(1rem, 4vw, 1.3rem);
  font-weight: 700;
  letter-spacing: 0.12em;
  color: #fff;
  text-shadow: 0 0 20px var(--purple-glow);
  margin-bottom: 4px;
}
.panel-sub {
  font-size: 0.72rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
}

/* Function buttons */
.func-grid {
  display: flex;
  flex-direction: column;
  gap: 11px;
  margin-bottom: 22px;
}

.func-btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  background: rgba(155,48,255,0.07);
  border: 1px solid rgba(155,48,255,0.2);
  border-radius: 14px;
  cursor: pointer;
  overflow: hidden;
  transition: all 0.28s cubic-bezier(0.22,1,0.36,1);
  text-align: left;
  width: 100%;
  backdrop-filter: blur(10px);
}
.func-btn::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--purple);
  box-shadow: 0 0 12px var(--purple);
  border-radius: 3px 0 0 3px;
  transform: scaleY(0);
  transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
}
.func-btn::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(155,48,255,0.18), rgba(155,48,255,0.05));
  opacity: 0;
  transition: opacity 0.28s;
  border-radius: inherit;
}

.func-btn:hover {
  border-color: rgba(155,48,255,0.5);
  transform: translateX(5px);
  box-shadow: 0 4px 24px rgba(155,48,255,0.2);
}
.func-btn:hover::before { transform: scaleY(1); }
.func-btn:hover::after  { opacity: 1; }

.func-btn.activated {
  border-color: var(--purple);
  background: rgba(155,48,255,0.15);
  box-shadow: 0 0 28px rgba(155,48,255,0.3), inset 0 0 20px rgba(155,48,255,0.08);
  animation: activatePulse 0.5s ease;
}
.func-btn.activated::before { transform: scaleY(1); }

@keyframes activatePulse {
  0%   { transform: translateX(5px) scale(1); }
  25%  { transform: translateX(5px) scale(1.025); box-shadow: 0 0 50px rgba(155,48,255,0.6); }
  100% { transform: translateX(5px) scale(1); }
}

.func-icon {
  width: 42px; height: 42px; border-radius: 11px;
  background: rgba(155,48,255,0.12);
  border: 1px solid rgba(155,48,255,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
  position: relative; z-index: 1;
  transition: all 0.28s;
}
.func-btn.activated .func-icon {
  background: rgba(155,48,255,0.25);
  border-color: var(--purple);
  box-shadow: 0 0 16px rgba(155,48,255,0.4);
}

.func-info { flex: 1; position: relative; z-index: 1; }
.func-name {
  font-family: 'Orbitron', monospace;
  font-size: 0.75rem;
  font-weight: 700;
  color: rgba(255,255,255,0.88);
  letter-spacing: 0.08em;
  margin-bottom: 2px;
}
.func-btn.activated .func-name { color: #fff; text-shadow: 0 0 10px rgba(155,48,255,0.5); }
.func-tag {
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 0.06em;
}
.func-btn.activated .func-tag { color: rgba(155,48,255,0.7); }

.func-arrow {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.18);
  position: relative; z-index: 1;
  transition: all 0.28s;
}
.func-btn:hover .func-arrow,
.func-btn.activated .func-arrow { color: var(--purple); transform: translateX(3px); }

/* ── DIALOG BOX ── */
.dialog-box {
  width: 100%;
  border: 1.5px solid var(--orange);
  border-radius: 14px;
  padding: 16px 18px;
  background: rgba(255,107,26,0.06);
  box-shadow: 0 0 24px rgba(255,107,26,0.2), inset 0 0 20px rgba(255,107,26,0.04);
  backdrop-filter: blur(12px);
  position: relative;
  overflow: hidden;
  min-height: 72px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  transition: box-shadow 0.3s;
}
.dialog-box::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--orange), transparent);
  opacity: 0.6;
}

.dialog-label {
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: var(--orange);
  text-transform: uppercase;
  margin-bottom: 7px;
  opacity: 0.7;
}

.dialog-msg {
  font-family: 'Orbitron', monospace;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,0.5);
  line-height: 1.5;
  transition: color 0.3s, text-shadow 0.3s;
}
.dialog-msg.has-msg {
  color: #fff;
  text-shadow: 0 0 12px rgba(255,107,26,0.4);
}

.dialog-msg .func-activated-name {
  color: var(--orange);
  text-shadow: 0 0 14px var(--orange-glow);
}

/* orange glow pulse when activated */
.dialog-box.flash {
  animation: dialogFlash 0.5s ease;
}
@keyframes dialogFlash {
  0%   { box-shadow: 0 0 24px rgba(255,107,26,0.2), inset 0 0 20px rgba(255,107,26,0.04); }
  40%  { box-shadow: 0 0 60px rgba(255,107,26,0.65), inset 0 0 40px rgba(255,107,26,0.15); }
  100% { box-shadow: 0 0 24px rgba(255,107,26,0.3), inset 0 0 20px rgba(255,107,26,0.06); }
}

/* back button */
.btn-back {
  position: absolute;
  top: 18px; left: 20px;
  background: transparent;
  border: 1px solid rgba(155,48,255,0.25);
  border-radius: 50%;
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: rgba(155,48,255,0.7);
  font-size: 1rem;
  transition: all 0.25s;
  z-index: 2;
}
.btn-back:hover {
  border-color: var(--purple);
  color: #fff;
  background: rgba(155,48,255,0.1);
  box-shadow: 0 0 16px rgba(155,48,255,0.3);
}

/* ═══════════════════════════════════════════
   FLOATING PARTICLE DOTS
═══════════════════════════════════════════ */
.dot-particle {
  position: fixed; border-radius: 50%; pointer-events: none; z-index: 1;
  animation: particleDrift linear infinite;
  opacity: 0;
}
@keyframes particleDrift {
  0%   { transform: translateY(100vh); opacity: 0; }
  8%   { opacity: 1; }
  92%  { opacity: 1; }
  100% { transform: translateY(-12vh); opacity: 0; }
}

/* ═══════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════ */
@media (max-width: 400px) {
  .glass-card { padding: 36px 18px 28px; border-radius: 18px; }
  .func-name  { font-size: 0.68rem; }
}
</style>
</head>
<body>

<!-- BG layers -->
<div class="bg-mesh"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="bg-grid"></div>
<canvas id="stars"></canvas>
<div class="scanline"></div>

<!-- ══════════════════ HOME PAGE ══════════════════ -->
<div class="page active" id="home">
  <div class="glass-card" style="text-align:center;">

    <div class="home-logo">SION <span>V2</span></div>
    <div class="home-tag">▸ Advanced Control System</div>
    <div class="home-divider"></div>
    <p class="home-desc">Sistema de control avanzado.<br>Accede al panel de funciones<br>para activar módulos.</p>

    <button class="btn-enter" id="enterBtn" onclick="goPanel()">
      <span>ENTER</span>
    </button>

    <div class="status-row">
      <span class="status-dot"></span>
      <span>Sistema activo · v2.0</span>
    </div>

  </div>
</div>

<!-- ══════════════════ PANEL PAGE ══════════════════ -->
<div class="page" id="panel">
  <div class="glass-card" style="position:relative;">

    <button class="btn-back" onclick="goHome()" title="Back">←</button>

    <div class="panel-header">
      <div class="panel-title">PANEL DE FUNCIONES</div>
      <div class="panel-sub">Selecciona un módulo para activar</div>
    </div>

    <div class="func-grid">

      <button class="func-btn" onclick="activate(this, 'Aimbot MetaX ☸', 'Módulo de puntería avanzada')">
        <div class="func-icon">☸</div>
        <div class="func-info">
          <div class="func-name">AIMBOT METAX</div>
          <div class="func-tag">Puntería avanzada · Módulo A</div>
        </div>
        <span class="func-arrow">›</span>
      </button>

      <button class="func-btn" onclick="activate(this, 'Aim Carapeta ꗈ', 'Sistema de apuntado dinámico')">
        <div class="func-icon">ꗈ</div>
        <div class="func-info">
          <div class="func-name">AIM CARAPETA</div>
          <div class="func-tag">Apuntado dinámico · Módulo B</div>
        </div>
        <span class="func-arrow">›</span>
      </button>

      <button class="func-btn" onclick="activate(this, 'Screen Calibrada 𖤍', 'Calibración de pantalla activa')">
        <div class="func-icon">𖤍</div>
        <div class="func-info">
          <div class="func-name">SCREEN CALIBRADA</div>
          <div class="func-tag">Calibración visual · Módulo C</div>
        </div>
        <span class="func-arrow">›</span>
      </button>

      <button class="func-btn" onclick="activate(this, 'BlackChip MioPrime ꙮ', 'Procesador de chip negro')">
        <div class="func-icon">ꙮ</div>
        <div class="func-info">
          <div class="func-name">BLACKCHIP MIOPRIME</div>
          <div class="func-tag">Chip procesador · Módulo D</div>
        </div>
        <span class="func-arrow">›</span>
      </button>

    </div>

    <!-- DIALOG BOX -->
    <div class="dialog-box" id="dialogBox">
      <div class="dialog-label">▸ Estado del sistema</div>
      <div class="dialog-msg" id="dialogMsg">Ninguna función activada...</div>
    </div>

  </div>
</div>

<script>
/* ─── STARS / CONSTELLATION ─── */
(function () {
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let W, H, dots;

  function resize() {
    W = c.width = window.innerWidth;
    H = c.height = window.innerHeight;
    init();
  }

  function init() {
    const n = Math.floor((W * H) / 11000);
    dots = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.18,
      vy: (Math.random() - 0.5) * 0.18,
      r: Math.random() * 1.4 + 0.4
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < dots.length; i++) {
      for (let j = i + 1; j < dots.length; j++) {
        const dx = dots[i].x - dots[j].x;
        const dy = dots[i].y - dots[j].y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < 110) {
          ctx.beginPath();
          ctx.moveTo(dots[i].x, dots[i].y);
          ctx.lineTo(dots[j].x, dots[j].y);
          ctx.strokeStyle = `rgba(155,48,255,${0.07*(1-d/110)})`;
          ctx.lineWidth = 0.7;
          ctx.stroke();
        }
      }
    }
    dots.forEach(d => {
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(200,160,255,0.45)';
      ctx.fill();
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0 || d.x > W) d.vx *= -1;
      if (d.y < 0 || d.y > H) d.vy *= -1;
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize(); draw();
})();

/* ─── FLOATING PARTICLES ─── */
(function () {
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'dot-particle';
    const size = Math.random() * 3 + 1.5;
    const hue = Math.random() > 0.5 ? '155,48,255' : '120,0,220';
    p.style.cssText = `
      left:${Math.random()*100}%;
      width:${size}px; height:${size}px;
      background:rgba(${hue},0.7);
      box-shadow:0 0 ${size*3}px rgba(${hue},0.6);
      animation-duration:${7+Math.random()*10}s;
      animation-delay:${Math.random()*12}s;
    `;
    document.body.appendChild(p);
  }
})();

document.getElementById('enterBtn').addEventListener('click', function (e) {
  const rect = this.getBoundingClientRect();
  const r = document.createElement('span');
